# 교차오염 때문에 계량 자리를 원료통 위에서 옮기려 했다 (9/21 결정대로 A·B 스쿱도 여기서 재면
# 흘린 분말이 C 용기로 떨어진다). material_3 에서 +Y 200 mm = [537, -98, 200], 자세각은 동일.
weigh_station_move_0922:
  goal: 계량 자리를 원료통 위에서 빼낸다 (교차오염) — A 의 scale.weigh_station 파라미터의 실체가 될 자리
  candidate_tried: {offset_mm: [0, 200, 0], posx: [537.0, -98.0, 200.0, 90.0, -180.0, -90.0]}
  result: |
    **실패.** 같은 로봇 상태에서 몇 분 차이로 원자리와 대조했다 (웜업·과부하 가설 배제):
        원자리 material_3 [537,-298,200] — 회차내부 σ **6.24**  · √(Mx²+My²) = **0.000 Nm**
        +Y200          [537, -98,200] — 회차내부 σ **26.08** · √(Mx²+My²) = **0.253 Nm**
    σ 가 4.2배다. max_std_g 8~10 이면 계량이 전부 무효가 된다.
    +Y200 의 표본열은 진폭 76 g · 주기 15~20 초로 크게 울린다:
        -70 -72 -89 -95 -97 -97 -88 -79 -72 -55 -39 -37 -30 -23 -21 -21 -25 -32 -32 -60 -78 -80 -91 -97 -95
    원자리는 같은 조건에서 -54~-76 사이 잡음뿐이다.
  moment_rule: |
    **모멘트가 σ 를 예측한다 — 9/21 이후 5번째 일관 사례.** 자세각(rx,ry,rz)은 두 자리가 동일한
    (90,-180,-90) 인데 좌표만 옮겨서 모멘트가 0 → 0.253 으로 갔고 σ 가 같이 뛰었다. 즉
    **중력·공구 보상 정확도가 관절해에 딸린다.** 보상이 안 맞는 자리에서 모멘트 잔차와 Fz 진동이
    함께 나온다. material_3 원자리의 Mx/My 는 CSV 원값이 1e-7 로, 물리 센서값이라기보다
    계산된 보상값이 상쇄되는 모습이다 — 기전 규명은 A 소관.
    특이점은 아니다: 손목 특이점(J5≈0)인데 J5 -101°, 엘보(J3≈0/180)인데 J3 40.8° 다.
  screening: |
    후보는 **모멘트로 20초에 판별된다** — --sets 1 --trials 1 --samples 10 으로 √(Mx²+My²) 만 본다.
    판정: < 0.05 Nm 유망 · > 0.1 탈락.
    방향은 관절1 변화가 작은 쪽이 유리하다: +Y200 은 J1 이 18.7° 움직이는데 +X150 은 5.6° 다.
    material_3 은 원료 열에서 X 가 가장 큰 자리(344/439/537)라 +X 가 열 밖으로 나가면서 변화가 작다.
  alternative: |
    모멘트 0 자리가 희귀하면 **로봇을 옮기지 말고 용기를 막는** 쪽이 낫다 — 계량 중 원료통에 뚜껑·
    받이판을 덮거나 스쿱 아래 받이 트레이를 둔다. 유일하게 검증된 좋은 자세를 지키고 재보정도 없다.
    하드웨어·운영 해결이라 조장·A 판단 항목.

# ── 9/22 ③ 짝 계량 + 용기 한 파지 — ② 의 병목은 임계식이 아니라 파지 재현성 ──
pair_and_grip_0922:
  scoop_pair:              # records/g1_rezero_0922_m3_scoop3_pair.csv (material_3 원자리, samples 25)
    method: --alt-actual-g 32 로 한 파지 안에서 채움(133)↔빈(32) 을 번갈아 재고 σ(gross₁−gross₂) 를 낸다
    valid_pairs: 8         # 3세트×3짝 중 2회차 제외 (내부σ 30.9 / 40.4 — 재는 중에 시료를 넣고 뺀 것)
    sigma_d_g: 2.40
    relative_error_pct: 27
    note: |
      **C 제안이 맞았다 — 차를 직접 재는 게 가정보다 낫다.** 직접 σ_d² = 5.76 인데
      독립·등분산 가정의 2σ_s² 는 6.55 로 과대추정이다. σ(d) 2.40 < √2×σ(단일) 2.55 라
      한 파지 안 두 계량이 양의 상관을 가져 공통 오차가 차에서 상쇄된다.
      ⚠️ 추정이 짝 수에 따라 2.46(4짝) → 2.11(7짝) → 2.40(8짝) 으로 흔들린다 = 상대오차 27 %.
         조장 결재에 올리려면 세트를 더 떠야 한다 (팀장 요청 8~10 세트, 현재 3).
      ⚠️ 이 값은 **사람이 스쿱에 시료를 넣고 뺀 조건**이다. 운영은 로봇이 붓는다.
         용기에서 사람 개입을 없애자 6.34 → 0.87 로 떨어진 것(아래)을 보면 이 값도 낙관 여지가 있다.
      "계량 사이 간격이 σ 를 키운다" 는 내 가설은 **철회한다** — 간격 5.9~42.9 s 범위에서
      간격 vs 차 상관이 r = +0.11 로 없다. 이 근거 없는 요구가 위 2회차 실수를 만들었다.

  cup_one_grip:            # records/g1_rezero_0922_cup_onegrip.csv (--sets 1 --trials 15, 재파지 0)
    sigma_between_trials_g: 0.87
    range_g: 3.2           # -51.4 ~ -48.2
    drift_g_per_min: -0.052    # 사실상 0
    within_trial_sigma: {mean: 6.90, p95: 8.89}
    moment_nm: 0.902           # Mx 0.875→0.904 로 거의 불변
    conclusion: |
      **재파지 대가가 7.3배다.**
          용기 · 한 파지        σ 0.87
          빈 그리퍼 · 재파지 없음 σ 1.84  (④)
          용기 · 재파지 3세트    σ 6.34  (①)
      ⚠️ **6.34 는 운영 재파지 σ 의 상한이다 (9/22 팀장 지적, B 확인).** ① 3세트의 세트 경계에서
         용기를 핑거 사이에 놓은 것은 **사람**이다 (measure_g1.py:329 `물체를 핑거 사이에 대고 → Enter`).
         운영에서는 TARE~VERIFY 사이에 **로봇**이 같은 AT 좌표에 내려놓고 다시 집으므로 사람 손이
         안 탄다. 즉 6.34 에는 사람 배치 산포가 섞여 있고, 실제 운영값은 0.87(재파지 0) 과 6.34 사이다.
         → **로봇 재파지 측정이 ② 의 생사를 가른다.** --auto-regrip 으로 사람을 빼고 5회 이상 잰다.
           6.34 그대로면 2σ² = 80 > 예산 56.25 로 N 과 무관하게 ② 가 성립하지 않는다.
      예산 56.25 에서 용기항이 2σ_cup² = 1.51 로 3 % 만 쓴다 → 남는 몫 54.74 를 스쿱이 다 쓴다.
          σ_d 1.39 → N 상한 28.3 · σ_d 2.11 → 12.3 · σ_d 2.40 → 9.5   (데모 필요 12)
      → **VERIFY ② 는 임계식 문제가 아니라 용기 파지 재현성 문제였다.**
        용기를 배치 내내 놓지 않거나 놓는 자리·집는 폭을 고정하면 ② 가 성립할 여지가 생긴다.
        구현은 A(skill_node 파지 경로)·C(process_fsm VERIFY 흐름), 결재는 조장.

  drift_was_warmup: |
    ④(10:04~10:23) 에서 +0.715 g/분 이던 표류가 이 측정(11시 이후)에서는 **-0.052 g/분** 으로
    사실상 0 이다. **사용자 가설대로 브링업 직후 웜업 현상이었다.** ④ 에서 "후반이 더 빠르다(가속)"
    고 본 것도 웜업 곡선의 일부로 보인다.
    → 운영 절차에 **"브링업 후 정착 대기"** 가 필요하다. 정착 시간은 ④ 20분 안에 안 잦아들었으므로
      20분보다 길다 — 별도 측정으로 확정해야 한다 (A 와 같이).

# ── 9/22 gain 직선 (한 파지 안 다점) — 오늘 가장 정밀한 측정 ─────────────
gain_0922_loadseries:
  file: records/g1_rezero_0922_cup_gainline.csv
  method: --load-series 78,155,232,309 — 한 파지 안에서 부어가며 4점. 재파지 0, 사람은 붓기만.
  station: workbench   (ABOVE [423,93,200], weigh_posture_0922 자세)
  excluded: 회차2 (155 g) — 내부σ 33.85, 재는 중에 부은 것. max_std_g 로 운영에서도 거부된다
  fit_3points: {slope_raw_per_g: 0.9037, intercept: -137.36, gain: 1.1065, offset_g: 152.00}
  linearity: 잔차 +0.1 / -0.3 / +0.2 g (최대 0.30) — 78~309 g 구간에서 직선이다
  uncertainty_pct: 0.10
  vs_material3_1.0331_pct: +7.10
  supersedes: |
    ⚠️ **오전 gain_0922_secant(0.9317 상대 → 절대 0.960, -7.1 %) 를 폐기한다. 부호까지 틀렸다.**
    오전 값은 15분 떨어진 두 실행(78 g·232 g)을 **사람이 재파지**한 상태에서 검증 안 된 표류 모델로
    보정한 것이고, ±13 % 불확실도 안에서 부호가 뒤집혔다. 팀장이 크기를 보류한 판단이 옳았다.
    오늘 값은 한 파지 안 3점 · 불확실도 0.10 % 로 130배 정밀하다.
  impact_on_verify1: |
    net = gain × (raw_gross − raw_tare) 라 gain 오차가 순량에 그대로 실린다.
    순량 450 g 을 material_3 gain 1.0331 으로 계산하면 420.1 g 으로 읽혀 **+29.9 g 편향**이다.
    ① 예산 22.5 g 의 **133 %** — **① 이 성립하지 않는다.**
  offset_not_transferable: |
    offset_g 152.00 은 --no-reset 으로 물려받은 영점에 딸린 값이라 common.yaml 로 옮길 수 없다.
    다만 offset 은 gross − tare 에서 소거되므로(offset_is_cancelled 절) 도징 판정에는 영향이 없다.
    **옮길 값은 gain 뿐이다.**

  # ⚠️⚠️ 결론을 뒤집을 수 있는 미검증 항목 ─────────────────────────────
  must_verify_material3_gain: |
    **현행 1.0331 자체가 같은 결함 방법으로 재진 값이다.** basis_2point 를 보면
    무게 2점(32·133 g) × **세트 3개** 라 세트마다 다시 잡았다 — 오늘 오전 workbench 측정과 같은 방법이고
    그건 부호까지 틀렸다. 즉 관측된 7.10 % 차이가
        (a) 실제 station 차이 인지
        (b) 1.0331 쪽의 측정 오차 인지
    아직 못 가린다. **material_3 에서도 --load-series 로 한 파지 다점 재측정이 필요하다** (약 5분).
    두 자리가 다 ~1.10 으로 나오면 "station 별 gain 분리" 결론 자체가 사라지고 단지 구값이 틀렸던 것이 된다.
    참고로 basis_2point 의 set_drift_g 가 1.05·1.48 로 작아(용기 6.34 대비) 스쿱 쪽은 재파지 영향이
    덜했을 수 있고, 2점·101 g 범위의 gain 불확실도는 약 2 % 로 추정된다 — 7.10 % 차이보다 작다.
    그래도 이 한 측정이 조장 결재 안건(common.yaml 구조 변경)의 근거 전부이므로 먼저 확인한다.

# ── 9/22 공구 무게 재측정 (케이블 정리 후) — A 소관, 여기는 기록만 ──────────
tool_weight_0922:
  context: 케이블 정리로 공구 하중이 바뀌어 자동측정을 다시 돌렸다 (사용자). 227 g 자세 의존의 원인 후보.
  registered_before: {kg: 1.320, cog_mm: [1.96, -32.76, 19.14], note: "common.yaml:24 의 R7 기록값"}
  measured_0922_1st: {kg: 1.37, cog_mm: [8.92, -35.15, 2.43]}
  reading: |
    · **무게 +50 g (1.320 → 1.37) 은 케이블과 방향이 맞다.** 선이 공구를 위로 당기고 있었다면
      0.49 N 만큼 가볍게 읽혔을 것이고, 장력을 없애니 그만큼 늘어난다.
      (참고: 같은 케이블 정리로 material_3 읽음값이 -65.7 → -52.3 으로 +13.4 g 움직였다.
       두 숫자가 다른 것은 하나는 한 자세의 읽음값, 하나는 여러 자세를 훑는 전역 적합이기 때문이다.)
    · **cy 가 재현된다 — 기존 -32.76 vs 새 -35.15 로 2.4 mm 안.** 대칭 그리퍼치고 35 mm 치우친 게
      이상해 보였는데 기존 등록값도 같은 자리였다. 이 공구의 실제 특성이다.
    · ⚠️ **cz 는 19.14 → 2.43 으로 17 mm 움직였다.** 선 하나 뽑아 축방향 무게중심이 그만큼 이동하는
      것은 크다. 자동측정이 자세를 충분히 훑지 못하면 cz 가 잘 안 잡히므로 **재현 확인이 필요하다.**
      2 mm 근처가 또 나오면 채택, 다시 10~19 대로 튀면 기존 19.14 유지하고 A 와 상의한다.
  apply: |
    자동측정 결과는 **`tool_weight` 이름으로 저장돼야** set_tool('tool_weight') 이 집는다
    (common.yaml:24 가 그 이름을 참조). 저장 뒤 **브링업을 다시 띄워야** 적용된다 —
    dsr_arm.initialize() 가 기동 시 한 번만 set_tool 을 부른다.
  validation: |
    **공구 설정이 227 g 자세 의존의 원인인지는 같은 영점에서 두 자세를 재면 갈린다** (약 4분):
      ① material_3 (영점 새로)  ② +Y200 (--no-reset 으로 영점 공유)
    두 자세 차이가 < 30 g 이면 set_tool 이 원인이었고 자세 의존이 해결된 것이다 — 계량 자리 선택이
    자유로워진다. ~227 g 그대로면 공구 설정과 무관한 JTS 특성이므로 한 자세 고정을 유지한다.
    **이 결과에 따라 재보정 범위가 달라지므로 gain 재측정보다 먼저 한다.**
  ownership: 공구 설정·등록은 A. 이 절은 계량에 미치는 영향만 기록한다 (B).

# ══════════════════════════════════════════════════════════════════════════
# ⭐ 9/22 근본 원인 확정 — 공구 무게중심 cz 가 약 73 mm 과소 등록돼 있다
#
# 오늘 씨름한 자세 의존(σ·gain·편향)이 **이것 하나로 전부 설명된다.**
# ══════════════════════════════════════════════════════════════════════════
root_cause_0922_cz:
  evidence_j6_sweep: |
    workbench 자세에서 **J6(공구 롤)만** 돌리며 빈 그리퍼 모멘트를 쟀다 (5점, 각 20초):
        J6 회전   -90°    -45°     0°    +45°    +90°
        Mx      +1.025  +1.020  +0.957  +0.954  +0.981   ← 폭 0.07  **불변**
        My      -0.361  -0.057  +0.374  +0.817  +0.938   ← 폭 1.30  **사인파**
    공구 Z 가 옆(-Y base)을 향하면 J6 축도 -Y 이므로, M = r × F (F = 아래) 에서
        Mx = -r_y·F   r_y 는 J6 축 방향 성분 → **J6 회전에 불변**
        My =  r_x·F   J6 회전으로 r_x 가 원을 그림 → **사인파**
    관측이 이 기하 예측과 정확히 일치한다. 즉 모멘트는 **중력이 치우친 무게중심에 작용한 것**이고
    JTS 보정 잡음이 아니다.
    My 진폭 검산: 축에서 치우침 √(17.29²+33.77²) = 37.9 mm × 13.63 N = 0.517 Nm (p-p 1.03)
                 관측 p-p 1.30 — 180°만 훑었으므로 일치한다.
  conclusion: |
    **Mx 의 불변값 +0.99 Nm = 축 방향으로 보상되지 않은 질량이다.**
        Δcz = 0.99 / 13.63 = **72.6 mm**
    cz 오차는 **공구 축이 중력과 수직일 때만** 지렛대가 되고 **나란하면 0** 이다. 그래서
        workbench  (공구 Z 옆)  → Mx ≈ 1.0    ✓ 관측
        material_3 (공구 Z 아래) → 모멘트 0.000 ✓ 관측
    **두 자세의 모든 차이가 이 하나로 설명된다** — σ (6 vs 19~27), gain (1.0013 vs 1.2650),
    자세 편향 89 g, +Y200 진동까지.
  CONFIRMED_cz: |
    ✅ **실측으로 확정했다 — 실제 cz = 89 mm 다.** 펜던트에서 cz 만 바꿔가며 workbench 자세의
