# ── 9/22 용기 계량 자세 ─────────────────────────────────────────────
# ⚠️ 관절 자세가 곧 측정 조건이다 — 9/21 에 material_1/2/3 이 σ 5~9배 차이 난 것이 자세 때문이었다.
# 아래는 9/22 용기 3점(①)·표류(④) 를 잰 자세다. 사용자가 **운영이 쓸 posj 에 직접 맞춰** 조그했다.
# ── ⚠️ 9/22 1차 측정에서 드러난 영점 표류 ────────────────────────────
# records/g1_rezero_0922_workbench_cup_robot.csv (빈 용기 78 g · 로봇 파지 · samples 20 · 3세트×5회)
# 세트 안은 매우 안정적인데(σ 1.05) 세트 사이가 계단처럼 뛴다. 그리고 **단조 증가다**:
#     세트1 -94.3 (t≈70 s) · 세트2 -84.1 (t≈180 s) · 세트3 -74.4 (t≈290 s)
#     110 s 마다 +10.1 · +9.8 g  →  **약 5.4 g/분**
# **재파지 탓이 아니다** — 모멘트가 거의 안 변했다 (Mx 1.142→1.084→1.057, Mz 0.951→0.944→0.917).
# 용기를 잡는 기하가 같았다는 뜻이므로 하중 제시 방식이 아니라 **영점 자체가 흐른다.**
# ⚠️ TARE(배치 시작)와 VERIFY(배치 끝) 사이는 10~15분이다 → **54~81 g 표류**. ① 예산이 22.5 g 이다.
#    σ 논쟁이 무의미해지는 크기다 — 이것이 지배항이다. 팀장이 예상한 "20분에 3 g" 의 36배.
# ⚠️ 그래서 이 측정의 회차평균 σ 8.19 는 대부분 표류다. 실제 계량 재현성은 **세트 안 σ 1.05** 쪽이다.
# 부수: (a) 각 세트 회차1 은 ABOVE 이동 직후라 회차내부 σ 가 10~17 (나머지 5~8) — settle 1.0 s 부족,
#           분석에서 제외한다. settle 을 늘리면 측정이 길어져 표류가 더 실리므로 늘리지 않는다.
#       (b) 09:27 중단분이 같은 CSV 에 섞였다 (스크립트가 append 모드) — 실험명 timestamp 로 걸러낸다.
# → 확인 절차: ④ 표류 측정(빈 그리퍼, 1분 간격 20회)으로 기울기를 독립 확인한다.
#   gain 3점은 --no-reset 으로 영점을 공유하고 78 g 을 앞뒤로 두 번 재어 표류를 뺀 뒤 기울기를 낸다.
drift_0922:
  rate_g_per_min: 0.715          # ④ 20분 실측 (선형 적합). 단, 가속한다 — 아래 status 참조
  rate_first_10min: 0.328
  rate_last_10min: 1.140
  residual_sigma_g: 1.84         # 추세 제거 후 = 재파지 없는 회차간 흔들림
  basis: ④ 빈 그리퍼·workbench ABOVE·1분 간격 20회 (재파지 없음, 하중 변화 없음)
  file: records/g1_rezero_0922_workbench_drift.csv
  superseded: records/g1_rezero_0922_workbench_cup_robot.csv 의 세트평균 3점(5.4 g/분)은 재파지가 섞여 과대추정이었다
  status: |
    ⚠️ 두 차례 정정했다. ④(20분 연속·1분 간격·재파지 없음) 실측이 최종이다.
      1차 "5.4 g/분 단조표류" → 철회. 재파지가 섞인 4분 구간만 본 값이었다.
      2차 "진동, 장기 평균 0"  → 철회. 20분 보면 단조 추세가 분명히 있다.
    ④ 결과 (records/g1_rezero_0922_workbench_drift.csv, 빈 그리퍼·workbench ABOVE):
      선형 추세 **+0.715 g/분** (20분 총 +14.3 g)
      **선형이 아니다 — 전반 10분 +0.328, 후반 10분 +1.140 g/분 으로 가속한다**
      추세 제거 후 잔차 σ **1.84 g**  (= 재파지 없는 회차간 흔들림)
      회차내부 σ 평균 6.82 · p95 8.27
    Mz 가 추세와 같이 올랐다 (0.736 → 0.771 Nm) — 열 영향 후보. 원인 규명은 A 소관.
    ⚠️ TARE→VERIFY 10~15분이면 계통 편향이 **+4.9 ~ 17.1 g** 이다 (① 예산 22.5 g 의 22~76 %).
       √N 으로 줄지 않는 항이므로 σ 와 별도로 다뤄야 한다. 가속 구간에 걸리면 더 나쁘다.

  regrip_is_dominant: |
    ④ 의 1.84 g(재파지 없음)과 용기 3실행의 세트 간 산포를 비교하면 재파지 성분이 분리된다.
    세트평균을 +0.715 g/분 으로 표류 보정한 뒤의 σ:
        ①-a 78g  6.98 · ①-b 232g  4.08 · ①-a' 78g  7.95  →  **평균 6.34 g**
    재파지 없는 1.84 g 대비 3.4배다. **σ_cup 의 지배항은 계량 잡음이 아니라 파지 재현성이다.**
    ⚠️ **이 값이면 VERIFY ② 가 성립하지 않는다.** 예산 2N·σ_s² + 2σ_cup² < 56.25 에서
       σ_cup 6.34 → 2σ_cup² = 80.39 > 56.25 → **스쿱 사이클 0회에서도 이미 초과**다.
       (σ_cup 2.56 → N 상한 12 · σ_cup 1.84 → N 상한 13.8)
    → k 나 σ_s 를 만질 문제가 아니다. **용기 파지 재현성을 고쳐야 ② 가 산다.**
      재파지를 없애면(배치 내내 용기를 놓지 않거나, 놓는 자리·집는 폭을 고정) 1.84 g 이고
      그건 ② 가 충분히 사는 값이다. 설계 변경이라 A·C 소관 — 팀장·조장 결재 항목.
    단서: 표류 보정에 쓴 0.715 g/분 은 ④(10:04~10:23) 값이고 용기 3실행은 09:33~09:53 이다.
          가속이 확인됐으므로 그 시각의 실제 기울기는 다를 수 있다. 재파지 σ 의 자릿수는
          바뀌지 않지만(1.84 대비 3~4배) 정확한 값은 인터리브 재측정에서 다시 본다.

weigh_posture_0922:
  station: workbench
  posj_deg: [49.65, 47.67, 76.41, 123.14, -118.39, -147.14]
  sol_space: 3                 # get_current_solution_space() — 9/22 실측
  # ⚠️ sol_space 로는 자세를 고정할 수 없다 (9/22 정정). material_3 계량 자세도 sol_space 3 인데
  #    posj 가 [-29.66, 38.19, 40.81, 179.87, -101.00, -29.55] 로 완전히 다르다. **posj 가 필요하다.**
  source: 펜던트 조그 — ros2 topic echo /dsr01/joint_states --once --field position (rad→deg)
  sol_space_source: ros2 service call /dsr01/dsr_controller2/aux_control/get_current_solution_space dsr_msgs2/srv/GetCurrentSolutionSpace "{}"
  note: |
    머지된 stations.yaml 에는 이 값이 없다. posj 가 있는 곳은 safe 와 넛지 경로
    (start_at_posj·start_above_posj·exit_posj) 뿐이고 workbench 를 포함한 스테이션 10곳은 posx 뿐이다
    (9/22 팀장이 로컬·origin 전 브랜치와 워크트리 두 곳을 훑어 확인). 조장이 아직 안 올린 상태다.
    skill_node:615 가 st.extra['posj'] 가 있으면 movej, 없으면 :634 의 movel 로 빠지는 구조라
    **기구는 이미 있고 값만 안 들어가 있다.**
    참고로 같은 stations.yaml 의 workbench→passbox_done start_at_posj
    [44.13, 56.20, 79.60, 124.83, -119.18, 55.21] 와 J1~J5 가 5~9° 안이다. J6 만 크게 다른데
    손목 롤이고 Fz 는 베이스 좌표계(dsr_arm.py:272)라 계량값에 안 붙는다.
    → 조장 posj 가 올라오면 이 값과 대조한다. J1~J5 기준 몇 도 안이면 그대로 쓰고,
      크게 다르면 ① 3점만 다시 잰다 (9/22 팀장 판단). 9/21 결정대로 계량 자세를 옮기면
      그 자리에서 재측정하는 것이 원칙이라 어느 쪽이든 오늘 값이 버려지지는 않는다.

