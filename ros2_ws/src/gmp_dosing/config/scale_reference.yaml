# ── 9/22 진동 제거·무결성 게이트 (B 구현, core/scale.py) ─────────────────
oscillation_handling_0922:
  finding: |
    저주파 진동이 자세를 가르는 유일한 변수다. 고주파(센서) 잡음은 어디나 같다:
        고주파 σ   material_1 5.5 · material_2 7.3 · material_3 4.2 · workbench 4.9~6.6
        저주파 σ   material_1 22.3 · material_2 24.1 · **material_3 4.4**
    material_1 표본열은 진폭 ±35 g · 주기 13~20 s 의 깨끗한 사인파다.
  why_window_tuning_failed: |
    창을 정수배 주기에 맞추면 상쇄되지만 **주기가 회차마다 13.5~20 s 로 흔들린다.**
    실제로 창 길이 최적값이 실행마다 18 ↔ 20 표본으로 바뀌어 재현되지 않았고, samples 32(2주기 예상)는
    예측 1.09 와 달리 5.15 가 나왔다. **고정 창으로는 못 맞춘다 — 회차마다 적합해야 한다.**
  implemented: |
    core/scale.py 에 `fit_oscillation(samples, period_s, apply_ratio=0.20)` 를 넣었다 (ROS·numpy 비의존).
    사인+상수 최소제곱으로 주기 8~30 s 를 훑어 **상수항**을 하중 추정값으로 쓴다.
    ⚠️ **가드가 핵심이다.** 무조건 적용하면 진동 없는 표본에서 잡음을 진동으로 오인해 값이 나빠진다 —
      9/22 전체 회귀(측정 17건·회차 171개)에서 **25 % 악화**, 17건 중 10건이 나빠졌다
      (용기 한 파지 0.85 → 3.85, workbench 1.82 → 7.26).
      residual ≤ 0.20 × 표본 σ 일 때만 쓰도록 가드를 넣으니 **적용률 11 %, 전체 -15.1 %, 악화 1건**이 됐고
      그 1건도 회차 3개짜리(같은 자리 8회로는 1.90 이 아니라 6.21)라 기준이 약한 쪽이다.
  regression_result: |
    주요 개선 (ratio 0.20):
        +Y200 (진동 큼)        4.21 → 0.36   (-91 %)
        y200 케이블 정리 후     4.74 → 3.15   (-34 %)
        material_2 sol3        2.72 → 1.71   (-37 %)
        material_1 sol3 s32    5.15 → 4.01   (-22 %)
    진동이 없는 곳(material_3·workbench·용기)은 가드에 걸려 **단순 평균 그대로**라 손해가 없다.
  hf_integrity_gate: |
    `max_hf_std_g` (기본 9.5) 를 ScaleConfig 에 넣고 reading(..., raw_hf_std=) 로 받는다.
    **정확도 게이트(max_std_g)와 다른 것을 잡는다:**
        max_std_g     "이 평균을 믿을 수 있나"  — 전체 σ 는 회차간 σ 를 ~0.2 배로 예측한다 (실측)
        max_hf_std_g  "재는 중에 건드렸나"      — 인접 표본 차이 기반
    9/22 실측 분리가 깨끗하다: **오염 10.57·12.26·26.45  vs  양성 최대 8.54** (양성 15건·오염 3건).
    ⚠️ 표본이 오염 3건뿐이라 임계 9.5 는 잠정이다. 측정이 쌓이면 다시 본다.
  ⚠️_runtime_unchanged: |
    **아직 런타임 동작은 안 바뀐다.** reading() 은 표본을 못 받고 평균·σ 만 받으므로,
    적합은 표본을 가진 skill_node._measure_weight_reading 이 불러야 한다 (A 소관 배선).
    raw_hf_std 는 필수 키워드 인자다. 누락하면 TypeError, None이면 ValueError로 즉시 실패해
    무결성 게이트가 조용히 꺼지지 않도록 테스트로 고정했다.
  ⚠️_does_not_fix_material_1: |
    **이것으로 material_1 이 쓸 수 있게 되지는 않는다.** 5.15 → 4.01 로 줄지만 material_3 의 1.33 과
    예산이 요구하는 수준에는 한참 못 미친다 (σ_s 4.01 이면 사이클당 2·4.01² = 32 로 예산 56.25 를 한
    사이클에 절반 넘게 쓴다). ~~**「계량은 material_3 한 자세에서만」 결정은 그대로다.**~~
    ⚠️ **철회 — 맨 아래 `decision_0922_verify2_off` 로 뒤집혔다 (9/22 팀장 승인).** ② 가 없어지면 이 σ 가 제약이 되지
      않는다. 다만 **사이클 제어 정밀도는 여전히 나빠진다** — 그 대가는 ① 이 잡는다.

# ══════════════════════════════════════════════════════════════════════════
# ⭐ 2026-09-22 팀장 승인 결정 — **VERIFY ② 를 끄고 ① 로만 간다**
# ══════════════════════════════════════════════════════════════════════════
decision_0922_verify2_off:
  decision: |
    **VERIFY ②(계측 신뢰성)를 끄고 ①(제품 판정)로만 간다.** 9/22 팀장 승인.
  rationale: |
    material_1/2 를 계량에 쓰려면 σ_s < 1.51 이 필요한데 실측은 4.01~5.15 다 (2.7~3.4배).
    k 를 2.0 까지 풀어도(오경보 4배) 필요치 2.28 로 여전히 부족하고, ① 허용폭은 제품 규격 ±5 % 라
    우리 소관이 아니다. **값 조정으로는 ② 를 살릴 수 없다.**
    그런데 **① 은 용기 계량만 쓴다** — |net − Σtarget| 의 net 은 workbench 용기 계량이고 스쿱을
    어디서 재든 무관하다. 즉 ② 를 포기하면 **원료별 제자리 계량이 가능**해지고, 이동·교차오염 문제가
    같이 풀린다. 무결성은 이번에 넣은 고주파 게이트(max_hf_std_g)가 대신 지킨다.
  what_this_obsoletes: |
    ⚠️ **아래 작업들이 불필요해진다 — 착수 전에 확인할 것:**
      · C 의 ② 브랜치 — tol = k·σ·√(2N+2) 동적 임계 구현, ItemRun.cycles
      · σ_weigh 파라미터 분리 (scale.weigh_sigma_g)
      · σ_d 세트 추가 측정 (팀장 §8-2, "상대오차 27 % → 20 %") — ② 결재 숫자였는데 ② 가 없어진다
      · VERIFY ② 임계를 둘러싼 k·N 상한 논의 전부 (k_choice · proposal · after_split 절)
      · 「계량은 material_3 한 자세에서만」 (9/21 조장 승인) — ② 없이는 제약이 사라진다
    ⚠️ **min_resolvable_g 는 이제 그냥 제거하면 된다.** process_fsm:291 이 유일한 실사용이었고
      그것이 ② 자체다. σ 분리를 기다릴 필요가 없어졌다 (after_split 절의 순서 ①②③ 도 불필요).
  what_still_stands: |
    · ① 은 그대로 — 용기 계량 gain·σ_cup 은 여전히 중요하다 (로봇 재파지 σ 0.91 확인)
    · TARE 유효성 게이트 부재 (C 발견) — ① 의 net 을 오염시키므로 **여전히 고쳐야 한다**
    · 고주파 무결성 게이트 — ② 가 하던 "계측을 못 믿는다" 역할을 일부 대신한다
    · cz 89 · 스쿱 gain 1.0013 · 자동측정 결함 — 전부 유효
  follow_up: |
    · max_std_g 를 올려야 material_1/2 가 통과한다 (적합 잔차 최대 23.9) — 대신 max_hf_std_g 가 무결성을 본다
    · 값 조합은 측정이 더 쌓인 뒤 조장이 정한다. 지금 PR 은 런타임을 안 건드린다
    · 이 결정을 SOT 에 반영해야 한다 (D-22 의 ② 서술, Q-11) — 조장·팀장
