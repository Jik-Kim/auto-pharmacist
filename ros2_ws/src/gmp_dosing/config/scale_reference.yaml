# 저울 보정 근거 요약 — 코드가 읽는 파일이 아니다. 런타임 값은 gmp_bringup/params/common.yaml 의 scale.* 가 단일 출처.
# 숫자는 calibration/*.csv 를 core/calib.py 로 돌리면 다시 나온다:
#   python3 -m gmp_dosing.core.calib ros2_ws/src/gmp_dosing/calibration/g1_rezero_0921_m3_2point.csv --method tool_force
# test/test_dosing.py 가 CSV → 이 값 → ScaleConfig 기본값의 정합을 검사한다.
#
# 2026-09-21 영점 재작업으로 전부 다시 쟀다. 9/18·9/19 측정은 폐기했다 (records/deprecated/scale_20260921/).
# 측정 과정과 그때 알아낸 것(자세 의존·요동 주기·파지 영향)은 calibration/README.md 에 있다.

status: measured
measured_on: 2026-09-21
station: material_3          # ⚠️ 이 보정은 이 자세에서 잰 것이다. material_1·2 는 요동이 5~9배 커 같은 값을 쓸 수 없다
scoop: scoop_3               # 세 스쿱은 파지부 두께만 다르고 무게·무게중심이 같아 보정을 공유한다 (9/21 확인)

method: tool_force           # workpiece 는 이번에 판단 근거를 만들지 않았다 — 필요하면 같은 CSV 로 재분석 가능

reference_weights:           # 실제 저울로 잰 물체 자체 무게 [g]
  empty_scoop_g: 32.0        # scoop_1/2/3 동일 (파지부 테이프·보드롱은 무게에 영향 없음)
  empty_container_g: 78.0

tool_force_calibration:
  fz_sign: -1.0
  gain: 1.03                 # 두 측정의 교차 검증 — scoop_1 3점 1.0279(±0.012) · scoop_3 2점 1.0331
  offset_g: 195.0            # 세션마다 ±5 g 움직인다 (190.8~197.4). 아래 offset_is_cancelled 참조
  min_resolvable_g: 5.0      # 운영 조건 실측 3σ 4.01 g + 여유. 레시피 A·B·C 셋 다 판정 가능 (아래 resolvable)
  max_std_g: 8.0             # ⚠️ [재검토 필요 — 9/22 재측정 뒤 확정] 스쿱 계량 p95 6.95 위로 잡은 값인데
                             #    용기 계량은 p95 9.09 다 → valid 13/15(87 %). 10.0 이면 15/15.
                             #    subject 별로 쪼개는 안은 max_std_split 절, 측정 근거는 cup_sigma 절 참조
  operating_samples: 20      # 이 분해능은 samples 20(16.4초) 기준이다 — 10 으로 줄이면 3σ 가 10.3 g 으로 나빠진다

  basis_2point:              # gain 직선의 근거 — calibration/g1_rezero_0921_m3_2point.csv (표본 10개)
    file: calibration/g1_rezero_0921_m3_2point.csv
    sets_per_weight: 3
    trials_per_set: 5
    samples_per_trial: 10
    w32:  {offset_single_g: 191.792, three_sigma_g: 8.6657,  within_trial_sigma_p95_g: 6.7197, set_drift_g: 1.0481}
    w133: {offset_single_g: 195.023, three_sigma_g: 10.2651, within_trial_sigma_p95_g: 7.8702, set_drift_g: 1.4815}
    fit: {gain: 1.0331, offset_g: 197.073, n_weights: 2}

  basis_samples20:           # 분해능·유효성 임계의 근거 — 운영 조건 그대로 (samples 20)
    file: calibration/g1_rezero_0921_m3_samples20.csv
    sets: 3
    trials_per_set: 5
    samples_per_trial: 20
    effective_period_s: 0.820   # 설정 0.1 s 지만 get_workpiece_weight 호출이 0.7 s — 표본은 전부 독립 (중복 0 %)
    three_sigma_g: 4.0116        # ← min_resolvable_g 의 근거
    within_trial_sigma_p95_g: 6.9456   # ← max_std_g 의 근거
    set_drift_g: 2.1693          # 스쿱을 놓았다 다시 잡는 오차. 폐기 전 7.9~8.6 g 보다 5배 작다

  offset_is_cancelled: |
    offset_g 가 세션마다 ±5 g 움직이지만 **도징 판정에는 영향이 없다.**
      gross = raw_g × gain + offset,  tare = raw_t × gain + offset
      scooped = gross − tare = (raw_g − raw_t) × gain      ← offset 이 소거된다
    process_fsm 이 SCOOP_TARE 에서 그 파지 상태의 빈 스쿱을 재 tare 로 쓰고, VERIFY 의 용기 순량도
    같은 구조다. 판정에 실제로 쓰이는 것은 gain 이고 offset_g 는 gross_g 표시·기록용 대략값이다.
    세션 변동의 원인은 파지할 때마다 스쿱 자세가 달라져 무게중심이 옮겨가는 것으로 보인다
    (모멘트로 확인, README 참조).
    **이 성질은 gmp_process 의 순량 계산 구조에 기대고 있다.** 9/21 C(공정 담당)와 합의 —
    `scooped_g = gross_g − scoop_tare_g` 구조와 SCOOP_TARE 에서 **그 파지 상태의** 빈 스쿱을
    tare 로 쓰는 것을 유지하고, 어느 쪽이든 이 경로를 바꿀 일이 생기면 서로 알린다.
    test_offset_cancels_out_in_net_weight 가 두 경로(FSM 의 gross 빼기, skill_node 의 net_g)를
    모두 고정한다.

  resolvable:                # target × tol% ≥ min_resolvable_g (5.0) — WeightModel.resolvable()
    A_200g_tol5: 10.0        # 가능 (여유 2.0배)
    B_150g_tol5: 7.5         # 가능 (여유 1.5배)
    C_100g_tol5: 5.0         # 가능 — 경계다. set_drift 가 커지면 먼저 깨진다
    caveat: |
      ⚠️ **resolvable() 은 운영에서 호출되지 않고, 앞으로도 붙지 않는다** (호출처는 test_dosing.py 뿐).
      구 BRD 3.1.3("목표량 × 허용 오차가 계량 분해능 아래인 주문은 시작 전에 거부")이 요구하던 게이트인데
      **BRD v1.0:81 에서 폐기 확정됐다 — "이 게이트는 구현하지 않는다" (SOT Q-11, 9/19 조장 확정).**
      문자 그대로 구현하면 시연 레시피(200/150/100 g ±5 %)가 min_resolvable_g=19 에 전부 미달해
      모두 거부되기 때문이고, 사전 분해능 판정은 배치 끝 VERIFY ①(제품 규격 대조)로 대체됐다.
      FR-01 도 "분해능 기반 사전 거부(구 3.1.3)는 Q-11로 폐기되어 미구현" 으로 적고 있다.
      (한때 이 절에 "미구현 요구사항, C 가 이슈 예정" 이라고 적었는데 **구판 BRD v0.1 을 본 오독**이었다.
       최신은 v1.0 이고 거기서 폐기됐다. 이슈로 올릴 사안이 아니다 — 9/21 TW 확인으로 정정.)
      위 표는 "이 저울로 그 목표를 가를 수 있는가" 라는 **물리적 사실**이며 코드가 수행하는 판정이 아니다.
      실제 합격 판정은 VERIFY ① 이고, 원료별 판정은 dosing.verdict_of() 가 분해능과 무관하게 한다.
      **따라서 min_resolvable_g 의 유일한 런타임 용도는 아래 VERIFY ② 하나다.**

  verify_mismatch:           # ⚠️ min_resolvable_g 의 유일한 런타임 용도 — 분해능과 성격이 다르다
    where: process_fsm.py — abs(verify_net_g - dosed_total()) > min_resolvable_g → VERIFY_MISMATCH
    what: |
      용기를 들어 잰 순량과 스쿱으로 재 누적한 투입량의 **차이** 임계다. 계량 한 번의 흔들림이 아니라
      **배치 전체에 걸친 여러 계량의 누적 차이**를 본다. 계량 횟수가 늘수록 √N 으로 커지므로 필요한 크기가
      분해능(계량 1회 3σ)보다 훨씬 크다. 한 파라미터가 성격이 다른 두 용도를 겸하고 있다.
      아래 숫자는 계량 1회 σ = 1.34 g (9/21 material_3 운영 조건 실측) 기준이다. 9/21 팀 결정으로 계량을
      material_3 한 자세에서만 하게 되므로 이 σ 가 원료 A·B·C 전부에 적용된다.
    false_trip_rate: |       # 정상인데 MISMATCH 나는 비율
      사이클 3회(원료 3종 각 1회): 차이 σ 3.78 g → 임계 5.0 에서 18.6 %, 15.0 에서 0.01 %, 19.0 에서 0.00 %
      사이클 6회(각 2회):          차이 σ 5.00 g → 임계 5.0 에서 31.8 %, 15.0 에서 0.27 %, 19.0 에서 0.01 %
      사이클 9회(각 3회):          차이 σ 5.98 g → 임계 5.0 에서 40.3 %, 15.0 에서 1.21 %, 19.0 에서 0.15 %
    detection_power: |       # 반대로 진짜 불일치를 잡는 힘 — 임계를 올리면 이쪽이 떨어진다
      실제 10 g 흘림 → 임계 5.0 에서 84 % 탐지, 15.0 에서 16 %, 19.0 에서 **3.6 %**
      실제 20 g 흘림 → 임계 5.0 에서 99.9 %,   15.0 에서 84 %,  19.0 에서 58 %
      현재 운영값 19.0 은 10 g 흘림을 96 % 놓친다 — VERIFY ② 가 사실상 작동하지 않는 상태다.
      계량을 material_3 으로 통일하면 스쿱을 든 채 원료통에서 계량 자세까지 이동하게 된다. 다만
      **VERIFY ② 회계가 깨지는 구간은 WEIGH_SCOOP ~ WEIGH_RESIDUAL 사이뿐이다** — 그 앞에서 흘린 것은
      WEIGH_SCOOP 이 있는 그대로 재므로 장부에 안 들어가고, WEIGH_RESIDUAL 뒤는 이미 마감된 사이클이다.
      C 가 stations.yaml 좌표로 재보니 그 임계 왕복은 material_1↔workbench 797.8 mm → material_3↔workbench
      814.6 mm 로 **2.1 % 늘 뿐**이고, 새로 붙는 material_1→material_3 193 mm 는 전부 비임계 구간이다.
      → "자세 통일로 VERIFY ② 중요도가 올라간다" 는 내 초기 서술은 철회한다. **수율·사이클 타임 문제로는
      여전히 유효하다** (흘린 만큼 원료가 줄고 목표 도달에 스쿱이 더 필요하다).
    proposal: |              # [C·조장 확인 필요] 고정값으로는 오검출과 탐지력을 동시에 만족시킬 수 없다
      필요한 임계가 배치마다 다르다(계량 횟수에 따라). 고정값 대신 계량 횟수에서 유도한다:
          tol = k · σ_weigh · √(2n + 2),   n = 그 배치의 총 스쿱 사이클 수
      **σ_weigh 는 측정값을 그대로 쓰는 별도 파라미터여야 한다 (scale.weigh_sigma_g: 1.34).**
      ⚠️ 처음에 σ = min_resolvable_g / 3 으로 유도하는 안을 냈다가 C 지적으로 철회했다 — 5.0 은 실측
      3σ 4.01 을 레시피 C(±5 g) 경계에 맞춰 올린 값이라 /3 하면 1.67 이 되어 실측 1.34 보다 24.6 % 크다.
      그 여유가 임계에 실려 N=10 부터 ② 임계가 ① 임계(데모 Σtarget×tol = 22.5 g)를 넘어 **②가 죽는다.**
      데모 레시피는 재시도가 하나도 없어도 N = ceil(200/40)+ceil(150/40)+ceil(100/40) = 12 다.
      목적이 다른 상수를 나눠 쓰면 안 된다 — 하나는 측정값(σ), 하나는 정책값(k)으로 분리한다.
    k_choice: |             # k = 3.0 (한때 2.5 를 제안했다가 C 반론으로 철회)
      **k 는 3.0 으로 둔다.** σ 1.34 기준 ② 유효 상한이 N=14 로 데모(12) 대비 여유가 얇아 보여 2.5 를
      제안했으나, C 지적으로 철회했다. 이유 둘:
        (a) **상한 N 표는 위험을 거꾸로 보여준다.** 레시피를 고정하고 N 만 흔든 표였는데, 실제로는 총량 T 가
            커지면 N 도 ① 임계도 같이 커진다 (①=0.05T 는 T 에 비례, ②∝√N∝√T). 검증:
              T=150 g(N=6)  ① 7.5  vs ② 15.0 → ② 죽음
              T=300 g(N=9)  ① 15.0 vs ② 17.9 → ② 죽음
              T=450 g(N=12) ① 22.5 vs ② 20.5 → ② 유효 (데모, ①/② = 1.10 으로 문턱 바로 위)
              T=900 g(N=24) ① 45.0 vs ② 28.4 → ② 유효
            즉 ②가 죽는 건 큰 배치가 아니라 **작은 배치**다. 재시도 걱정은 데모가 문턱 바로 위라 생긴
            증상이고, 구조적 위험은 반대편에 있다. k 를 낮춰도 어느 쪽도 해결되지 않는다.
        (b) **k 는 통계적 의미를 가진 값이라 맞추려고 건드릴 자리가 아니다.** GMP 에서 VERIFY_MISMATCH
            한 건은 QA 조사 + 감사증적 1건이다. k 3→2.5 는 오검출을 0.27 %→1.24 % 로 4.6배 올린다
            — 배치 370건당 1건이던 헛된 일탈 조사가 81건당 1건이 된다.
      **옳은 레버는 σ 다** (k=3 고정, ① 22.5 기준 ② 유효 상한 N):
          σ 1.34(현재) → 14 · σ 1.00 → 27 · σ 0.89 → 34 · σ 0.70 → 56
      σ 0.89 만 되어도 상한 34 라 데모의 재시도 여유 문제가 사라진다. samples 20→25 에서 연속 측정
      창평균 σ 가 0.89 였으나 파지 재현 오차가 빠진 낙관치라 **세트 포함 실측이 필요하다 (B 예정).**
      소량 배치에서 ②가 죽는 것은 σ 로도 안 없어진다 — 레시피별로 ②가 정보를 주는지 접수 시점에
      계산해 기록하는 쪽이 정직하다 (C 가 BRD 3.1.3 게이트 이슈에 포함 예정).
    cup_sigma: |           # 9/21 1차 측정 (ABOVE 자세 맞음, 단 사람이 들어 쥐여줌) — σ_verify 확정 아님
      records/g1_rezero_0921_workbench_cup.csv · 빈 용기 78 g · samples 20 · 3세트 × 5회
        세트 안 σ 0.98 g (스쿱 0.89 와 비슷) · **세트 간 흐름 10.5 g** (스쿱 2.2) · 회차 평균 σ 4.54
        회차 내부 σ p95 9.09 g · 단일점 offset 207.43 · Mx +1.07 / My +0.15 / Mz +0.53
      회차 내 반복은 좋고 세트 간만 나쁘다 → 사람이 매번 들어 쥐여준 탓으로 보인다(모멘트도 세트마다 흔들림).
      운영은 로봇이 AT 로 내려가 일정하게 잡으므로 **σ_verify 로 그대로 쓸 수 없다. 로봇 파지로 재측정한다**
      (measure_g1 --pick-lift-mm 100 으로 AT→파지→ABOVE 경로를 따라간다, 9/22 예정).
      **판정 기준: σ_cup < 2.58 g 이어야 데모 레시피(k=3, N=12)에서 ②가 산다.**
        σ_cup 0.98 → tol 20.1 g (② 유효) · σ_cup 4.54 → tol 27.5 g (② 죽음)
      **그리고 max_std_g 8.0 을 다시 봐야 한다** — 용기 계량 p95 9.09 라 valid 13/15(87 %)다.
      TARE·VERIFY 가 valid=false 면 배치가 진행되지 않는다. 10.0 이면 15/15 (폐기 전 값이 공교롭게 맞는다).

    max_std_split: |       # [제안 — B 소관 값, 구현은 A·C] max_std_g 를 subject 별로 쪼갠다
      스쿱 계량과 용기 계량은 **자세도 하중도 파지 대상도 다르다** — 9/21 실측 p95 가 6.95 vs 9.09 다.
      하나로 덮으면 반드시 **둘 중 나쁜 쪽에 맞춘 값**이 되고 좋은 쪽에서 불량 계량을 놓친다:
      현행 10.0 은 용기 p95 9.09 를 덮느라 스쿱 p95 6.95 보다 44 % 헐겁다 (C 지적, 동의).
      쪼갤 키는 이미 있다 — WeightReading.subject 가 "scoop"(WeighHeld) | "container"(WeighContainer) 를
      구분한다(gmp_interfaces/msg/WeightReading.msg:10). 새 개념을 만들 필요가 없다.
      소관: 값·근거는 B, skill_node._measure_weight_reading 의 subject 별 선택은 A,
            process_fsm 의 _invalid_or·VERIFY 게이트가 그 값을 받는 것은 C, 파라미터 추가는 조장.
      **9/22 로봇 파지 재측정으로 용기 p95 가 내려갈 수 있으므로 값은 그 뒤에 정한다.**

    tare_has_no_validity_gate: |   # ⚠️ [C 소관 결함 — max_std_g 판단에 직결] C 가 9/21 발견
      **TARE 스텝에만 계량 유효성 검사가 없다.** process_fsm 에서 _invalid_or() 는 SCOOP_TARE·
      WEIGH_SCOOP·WEIGH_RESIDUAL 에서만 불리고, VERIFY 는 _verify_invalid 카운터를 따로 쓴다.
      TARE 는 gross_g 를 그대로 받는다 (self.cur 가 아직 없어 _invalid_or 를 못 부른 것으로 보인다).
      **그래서 위 "용기 계량 valid 13/15" 의 의미가 갈린다:**
        · VERIFY 쪽 — 게이트가 있어 재계량하고, max_invalid 2 를 넘으면 WEIGH_INVALID 일탈. 정상 동작.
        · TARE 쪽  — 13 % 가 **검증 없이 그대로 통과**한다. 무효 tare 는 verify_net_g = gross − tare_g 를
                     오염시켜 **VERIFY ①(제품 규격)·②(계측 신뢰성) 을 둘 다** 틀리게 만든다.
      현행 max_std_g 10.0 에서는 용기 계량이 15/15 라 지금 당장은 안 터지고, **8.0 을 적용하면 드러난다.**
      → max_std_g 를 낮추기 전에 TARE 게이트가 먼저 들어가야 한다. C 가 사용자 확인 후 처리 예정.

    missing_sigma: |       # ⚠️ [B 측정 필요] σ 가 하나가 아니다
      위 수식은 모든 계량이 같은 σ 를 갖는다고 가정한다. 실제로는:
        · 스쿱 계량(WEIGH_SCOOP·WEIGH_RESIDUAL) — 계량 자세. 9/21 팀 결정으로 material_3 통일 → σ 1.34 실측
        · 용기 계량(TARE·VERIFY) — **workbench 자세의 용기 계량이라 아직 안 쟀다**
      엄밀한 형태는 tol = k·√( Σ_i 2·n_i·σ_i² + σ_tare² + σ_verify² ) 다 (C 지적).
      계량 자세가 통일되면 스쿱 쪽은 단일 σ 가 되지만 **용기 계량 σ 는 별도 측정이 필요하다** — B 소관.
    after_split: |         # [조장 판단] σ 를 분리하면 min_resolvable_g 는 운영 파라미터가 아니게 된다
      **σ·k 로 VERIFY ② 를 바꾸면 min_resolvable_g 의 런타임 용도가 0 이 된다** (C 제안, B 검증).
      지금 값으로 읽히는 곳은 넷인데 실사용은 하나뿐이다:
        · process_fsm:291 — VERIFY ② 임계. **유일한 실사용**. σ·k 가 이 자리를 대신한다
        · scale.py:55 — resolvable(). 구 BRD 3.1.3 게이트용인데 그 요구사항이 폐기 확정(위 caveat)
        · process_node:83,96 — 파라미터 선언·ScaleConfig 전달
        · skill_node:911 — ScaleConfig 에 넣지만 **reading() 은 max_std_g 만 쓴다. 지금도 무의미하다**
      → 분리 뒤에는 `common.yaml` 에서 빼고 `scale_reference.yaml`·`calibration/README.md` 에만 두는
      **측정 기록**이 되는 게 맞다. 이름도 그때 정리된다 — "이 분해능 아래는 못 가른다" 는 뜻인데
      그 의미로 쓰이던 자리(접수 게이트)가 없어졌으므로 이름이 가리키는 용도가 실제로 사라진 상태다.
      단 **`ScaleConfig` 필드와 `resolvable()` 은 남긴다** — 분해능 판정표를 계산하고 테스트가 고정하는
      물리적 사실이라 라이브러리에는 필요하다. 운영 파라미터에서만 빠진다.
      순서: ① 9/22 σ 측정 → ② σ 파라미터 추가 + VERIFY ② 수식(C) → ③ 그때 min_resolvable_g 제거.
      **②가 되기 전에는 뺄 수 없다** — 지금은 그 값이 VERIFY ② 임계다.

      ③ 은 common.yaml 한 줄 삭제로 끝나지 않는다 (C 지적, B 재확인). 여러 패키지를 같이 고쳐야 한다:
        · common.yaml scale.min_resolvable_g 삭제 ..................... 조장
        · skill_node:911 ScaleConfig(min_resolvable_g=...) 전달 제거 ... A
        · test_skill_node_weigh_held.py:493 overrides 에서 제거 ........ A
        · process_node:83,96 선언·ScaleConfig 전달 제거 ................ C
        · process_fsm:27,289,291 ② 수식·주석 교체 ..................... C
        · make_process_drawio.py:130,253 의 ② 표기 교체 ................ C
        · scale.py 의 ScaleConfig 필드·resolvable() 는 유지 ............ B
        · scale_reference.yaml·calibration/README.md 에 측정 기록으로 보존 . B
      ⚠️ 순서를 어기면 **기동이 아니라 배치 도중에** 터진다. C 는 "기동 시점" 이라 했는데 실제로는 더 늦다:
         skill_node 는 automatically_declare_parameters_from_overrides=True(:64) 라 이 파라미터가
         common.yaml 에만 존재하고, 읽는 자리도 생성자가 아니라 _measure_weight_reading(:911) 이다.
         그래서 common.yaml 에서 먼저 빼면 **브링업은 멀쩡히 뜨고** 첫 계량 —
         _do_weigh(:952 용기) 또는 _do_weigh_held(:989 스쿱) — 에서 ParameterNotDeclaredException 이 난다.
         이미 시료를 퍼담은 뒤에 터지므로 실물 피해가 있다. **common.yaml 에서 빼는 건 skill_node 수정 뒤다.**
         process_node 는 :83 에 기본값 선언이 있어 안 죽는다. 대신 조용히 19.0 을 계속 쓴다 — 더 나쁘다.

    ownership: |
      process_fsm 수식·ItemRun.cycles 는 C, 파라미터 추가·min_resolvable_g 제거는 조장, σ 측정은 B.
      C 제안 순서: ① 계량 자세 결정 → ② common.yaml 갱신 → ③ σ 분리 + 동적 임계 구현 → ④ 가상 브링업 실측.

  caveats: |
    · 이 값은 material_3 자세 전용이다. material_1·2 는 같은 조건에서 회차 평균 σ 가 5~9배 크고,
      계량 창을 두 배로 늘려도 material_3 의 절반 수준에 못 미친다 — 그 자세에서는 tol 5 % 판정이 안 된다.
      **9/21 팀 결정(조장 승인): 계량은 한 자세에서만 한다 — 어느 원료든 material_3 자세로 가서 잰다.**
      원료를 푸는 곳은 그대로 원료별 material_1/2/3 이고 계량(WeighHeld)만 통일된다. 계량 자세는
      파라미터(scale.weigh_station, 초기값 material_3)로 두어 나중에 통 밖 자리로 옮길 수 있게 하며,
      옮기면 그 자리에서 저울을 다시 잰다. 구현은 A(skill_node WeighHeld), 그 뒤 조장이 common.yaml 갱신.
    · 세트가 3개뿐이라 set_drift 추정이 거칠다. min_resolvable_g 5.0 은 실측 3σ 4.01 에 여유를 둔 값이고,
      C 레시피(±5 g)가 경계에 걸리므로 세트를 더 뜨면 이 값부터 다시 본다.
    · workpiece 경로는 이번에 결론을 내지 않았다. 같은 CSV 에 열이 들어 있어 재분석은 가능하다.
