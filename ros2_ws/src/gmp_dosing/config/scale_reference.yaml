# ⚠️⚠️ 2026-09-22 케이블 조건 경고 — 아래 값을 쓰기 전에 반드시 읽을 것
#
# 그리퍼에 선이 연결돼 있었고 **그 장력이 계량을 오염시켰을 가능성**이 크다 (9/22 강사 지적).
# 사용자가 9/22 오후에 선을 뽑아 장력을 크게 줄였다.
#
# **이 파일의 아래 모든 절은 「케이블 장착 조건」에서 잰 값이다** — 9/21 재영점(gain 1.0331 ·
# 3σ 4.01 · 제안 5.0/8.0), 9/22 측정 전부, 그리고 common.yaml 의 현행 운영값(gain 0.886 ·
# min_resolvable_g 19)까지 같은 조건이다.
#
# 장력 가설이 설명하는 관측 (전부 이 파일 안에 있다):
#   · 자세별 편향 — 팔 자세가 바뀌면 선이 당기는 정도가 달라져 공구에 힘이 걸린다
#   · +Y200 진동 (σ 26.08, 진폭 76 g, 주기 15~20 s) — 팽팽한 선이 스프링으로 작동
#   · 모멘트 0.000 → 0.253 Nm — 선이 당기면 모멘트가 생긴다. **모멘트는 원인이 아니라 증상일 수 있다**
#   · 27 g 계단 (접촉 뒤 4분 지속) — 접촉으로 선 배치가 바뀌어 새 장력 상태로 고정
#   · gain 1.0331 vs 1.1065 — 하중이 커지면 팔이 처져 장력이 변하므로 기울기도 오염된다
#
# → 판별: +Y200 을 20초 다시 잰다. σ ~6 · 모멘트 ~0 으로 돌아오면 케이블 확정이다.
# → 확정되면 결론은 "station 별 gain 분리" 도 "구값 오차" 도 아니라 **「케이블 정리 뒤 전면 재보정」**
#   하나다 (9/22 팀장 판단). 재보정 목록:
#     ① material_3 스쿱 경로 · workbench 용기 경로 각각 --load-series 한 파지 다점 gain
#     ② 영점부터 새로 (--no-reset 없이)
#     ③ samples 20 운영 조건 3σ
#     ④ max_std_g 근거
#   결과는 새 절 `cable_removed_0922` 에 넣고, 그때까지 아래 값을 운영에 반영하지 않는다.
#
# **케이블 정리 전 값과 정리 후 값을 섞어 쓰지 말 것.**
# ══════════════════════════════════════════════════════════════════════════

# ⭐ 2026-09-22 팀장 승인: **VERIFY ② 를 끄고 ① 로만 간다** → 맨 아래 `decision_0922_verify2_off`
#    이 파일 앞부분의 「계량은 material_3 한 자세에서만」 서술 4곳은 그 결정으로 **철회됐다** (각 자리에 표시).
