# 저울 보정 근거 요약 — 코드가 읽는 파일이 아니다. 런타임 값은 gmp_bringup/params/common.yaml 의 scale.* 가 단일 출처.
#
# ⚠️ 2026-09-21: 영점(offset)부터 다시 잡기로 해서 9/18·9/19 G1 측정 근거를 전부 폐기했다.
#    원시 CSV 는 records/deprecated/scale_20260921/ 로 옮겼고 (git 밖), 폐기 사유는 그 폴더의 README.md 에 있다.
#    여기 있던 gain 0.8859 · offset_g 247.091 · min_resolvable_g 19.0 · max_std_g 10.0 · 3σ 12.6 g 은
#    **전부 무효다.** 다시 쓰지 말 것 — 되살리려면 새 측정으로 재현되는지 먼저 확인한다.
#
# 재측정이 끝나면 이 파일을 다시 채운다. 채우는 방법:
#   1) calibration/measure_g1.py 로 CSV 를 뜬다 (--out 은 records/ 아래, git 밖)
#   2) python3 -m gmp_dosing.core.calib <csv> --method tool_force 로 요약을 낸다
#   3) 확정된 CSV 를 calibration/ 으로 복사해 커밋하고, 그 요약을 아래 measurements 에 옮긴다
#   4) test/test_dosing.py 에 CSV → 이 파일 → ScaleConfig 정합 검사를 다시 붙인다 (폐기와 함께 지웠다)

status: rezero_pending      # rezero_pending | measured — 재측정 전에는 이 파일에 확정값이 없다

method: null                # [재측정 대기] tool_force | workpiece — 9/19 의 tool_force 확정도 폐기 근거 위였다

measurements: {}            # [재측정 대기] 무게별 요약(offset·σ·3σ·표본 독립성)과 두 점 이상의 gain 직선

reference_weights:          # 실제 저울로 잰 물체 자체 무게 [g] — 보정 계산과 무관한 실측이라 유지한다
  empty_scoop_g: 32.0
  empty_container_g: 78.0

deprecated_20260921:        # 무엇이 왜 무효가 됐는지 — 같은 값이 다시 기어들어오는 것을 막기 위해 남긴다
  moved_to: records/deprecated/scale_20260921/
  files: [g1_scoop133g_tool_force.csv, g1_scoop_0919_both.csv]
  voided: [method, gain, offset_g, min_resolvable_g, max_std_g, fz_sign]
  why: 영점을 다시 잡기로 해서 이 데이터로 세운 보정 직선·분해능·유효성 임계가 전제를 잃었다
  keep_in_mind: |
    재측정 때 다시 확인할 것 —
      · 표본 간격: 0.05 s 면 표본이 겹쳐 σ 가 작게 나왔고 0.82 s 면 독립이었다. σ 는 표본 수가 아니라 간격이 정한다
      · 자세 의존: tool_force 편향은 자세마다 다르다. weigh_held 가 실제로 재는 자세에서 떠야 한다
      · workpiece 경로: reset 이 success 를 줘도 잔류 오차가 값을 지배한 적이 있다. 쓰려면 이동을 끼운 절차로 재확인
      · 분해능 vs 허용오차: 레시피는 tol 5 % 다. 100 g 이면 ±5 g — 3σ 가 그보다 크면 이 저울로는 합격 판정을 못 한다
