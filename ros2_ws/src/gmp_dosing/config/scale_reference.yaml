cable_condition: attached    # attached | removed — 아래 모든 값의 전제. removed 값은 cable_removed_0922 절로 간다

# ── 9/22 케이블 가설 판별 결과 — **기각. 자세 의존은 진짜다** ──────────────
cable_test_0922:
  verdict: |
    **케이블 장력은 진동·자세 의존의 원인이 아니다.** 선을 뽑아 장력을 줄인 뒤 같은 두 자리를
    다시 쟀는데 패턴이 그대로다:
                                내부σ    |Mxy|
        원자리 material_3  장착    6.24    0.000
        원자리 material_3  정리후   5.97    0.033     ← 여전히 좋다
        +Y200            장착   26.08    0.253
        +Y200            정리후  27.61    1.243     ← 여전히 나쁘다
    +Y200 표본열도 진폭 ~75 g 로 계속 울린다. 모멘트 규칙은 유지된다 (0.033→5.97, 1.243→27.6).
    **강사 확인: 자세 의존성은 이 로봇에 실제로 존재한다 (9/22 사용자 전달).** 측정 인공물이 아니다.
  pose_bias_magnitude: |
    **자세만 바꿔서 읽음값이 227 g 변한다 (2.2 N).** 정리 후 두 측정이 영점을 공유해서
    (+Y200 에서 영점 → 원자리는 --no-reset) 직접 비교가 된다:
        원자리 -52.3  ·  +Y200 +174.3  →  차이 226.6 g   (200 mm 옮긴 것뿐)
    케이블 장착 때 두 측정은 각자 영점을 잡아 이 비교가 안 됐다 — 그때는 크기를 몰랐다.
  root_cause_candidate: |
    두 자리의 **자세각이 동일한데**(90,-180,-90) 227 g 이 다르다. 중력 방향이 같으니 단순 중력
    보상 오차로는 설명이 안 된다. 남는 후보는 **JTS 보정이 관절 자세에 따라 틀어지는 것**이고,
    set_tool 의 무게·무게중심이 실물과 안 맞으면 그렇게 된다.
    ⚠️ 케이블을 뽑아 **공구 하중이 바뀌었으므로 set_tool 을 지금 실물로 다시 넣어야 한다 (A)**.
    이것이 227 g 자세 의존의 원인일 수 있다.
  consequences: |
    · **+Y200 은 확정 탈락.** 계량 자리를 옮기지 않는다 → 교차오염은 **용기를 덮는 쪽**으로 간다
    · offset 은 gross − tare 에서 소거되므로(offset_is_cancelled) **같은 자세에서 재는 한 227 g 은
      판정에 안 들어온다.** 9/21 결정(계량은 한 자세에서만)이 이미 이걸 막고 있다
    ⚠️ **철회 — 맨 아래 `decision_0922_verify2_off` 로 뒤집혔다 (9/22 팀장 승인).** ② 를 끄면 자세 통일 제약이 사라진다.
      다만 **같은 자세에서 재면 offset 이 소거된다는 물리는 그대로다** — 바뀐 것은 자세를 통일할 의무뿐이다.
    · 다만 용기 경로(workbench)와 스쿱 경로(material_3)는 **자세가 다르므로 gain 을 따로 봐야 한다**
    · 케이블 정리로 정역학이 바뀌었다 (원자리 평균 -65.7 → -52.3, +Y200 은 My -0.13 → -1.23 Nm).
      **원인이 장력 오염은 아니었지만 기계 상태가 그때와 달라 재보정은 필요하다** (팀장 판단 유효)

