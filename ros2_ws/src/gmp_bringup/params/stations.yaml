# 9/23 사용자 실물 검증 DRL: m0609_tw_autopharm_moved.drl (BASE, mm/deg)
# fixed_path.verified는 원본 고정 경로 검증, calibrated는 높이 보정 검증이다.
# A 높이 보정 근사값은 보존하며 B/C 높이 보정 모델은 없다. 자동 보정은 모두 비활성.
# 원료 반환·넛지는 DRL 주 루프에 없으므로 좌표 갱신만으로 검증 완료로 보지 않는다.
# workbench empty 접근은 DRL 관절각 도착 후 실제 TCP에서 Z -200: posx와 합성하지 않는다.
# safe.posx는 자리표시자이며 safe 이동은 posj를 사용한다.
