# 셀 공통 파라미터 — 실행값의 단일 출처 (docs/interfaces.md 4절)
#
# 구조
#   mode / stations_file : 실행 환경과 위치 파일
#   robot                : 두산 로봇 연결·이동
#   gripper              : RG2 백엔드·폭·파지 판정
#   scale                : 로봇 힘센서 계량
#   dosing               : 공정 반복 조건
#   safety               : 힘제어·넛지·이동 제한
#   pour                 : 붓기와 털어내기
#   interlock            : 정지 시 복귀 위치
#
# cell.launch.py의 mode·vel_scale·simulated·stations_file 인자는 아래 값을 실행 시 덮어쓴다.
/**:
  ros__parameters:
    # ── 실행 환경 ────────────────────────────────────────────────────
    mode: virtual                  # virtual | real
    stations_file: ""             # launch가 stations.yaml의 절대 경로를 넣는다

    # 매 기동 시 작업자가 명시할 때만 사용. 인출·상승 완료 후 material.posx 정지 상태 전용.
    # 투입·반환 중 중단된 상태에는 사용 금지. 공정 기록이나 안전 차단은 복원하지 않는다.
    restore:
      material_id: ""
      operator_id: ""
      confirmed: false

    # ── 두산 로봇 ────────────────────────────────────────────────────
    robot:
      id: dsr01
      model: m0609
      tool_name: tool_weight        # 컨트롤러 등록명 (R7: 1.320 kg, CoG 1.96/-32.76/19.14)
      tcp_name: GripperDA_v1        # 실물 컨트롤러에 등록된 TCP
      virtual_tcp_name: GripperDA_v1 # 가상에서도 실물과 같은 이름으로 아래 오프셋을 등록
      tcp_offset_mm_deg: [0.0, 0.0, 208.0, 0.0, 0.0, 0.0]  # 툴 좌표계 +Z 208 mm
      vel: 60.0                     # set_velx 병진 mm/s · 회전 deg/s 상한
      acc: 60.0
      vel_scale: 0.3                # 런치가 덮어쓴다. 실물 첫 기동 0.2
      shutdown_timeout_s: 5.0       # 종료 정리 대기 한도. 초과 시 해제 성공으로 처리하지 않음
      motion_timeout_s: 30.0        # 비동기 이동 제한. 초과·취소 시 MoveStop(DR_SSTOP)
      startup_timeout_s: 15.0       # 서비스 준비 및 상태·힘 조회 응답 각각의 제한 시간
      transfer_joint_vel_deg_s: 0.0   # TODO([A]): 티칭 검증 후 관절 이송 속도 설정. 0은 이송 거부
      transfer_joint_acc_deg_s2: 0.0  # TODO([A]): 약통 기울기·흘림 검증 후 설정. 직선 acc와 별개
      pose_xyz_tolerance_mm: 2.0      # 출발 이력·도착 위치 확인 허용오차
      pose_rotation_tolerance_deg: 2.0 # ZYZ 표현 차이가 아닌 실제 회전각 오차
      joint_tolerance_deg: 1.0        # 티칭 관절 구성·수동 이동 여부 확인 허용오차

    # ── RG2 그리퍼 ───────────────────────────────────────────────────
    gripper:
      backend: modbus               # modbus | dio  (virtual 은 런치가 자동)
      open_width_mm: 100.0           # 운용 열림 폭. 데이터시트의 전체 조절 범위는 0~110 mm
      scoop_search_width_mm: 0.0     # 스쿱 파지 탐색 목표 폭 — 기대 폭(WRONG_TOOL 판정)과 분리, 0 = 완전히 닫힐 때까지 접촉 탐색 (A 리뷰, PR #165)
      scoop_expected_widths_mm: [15.5, 18.0, 28.0]  # A/B/C 스쿱 폭 지문 (9/19 확정)
      scoop_extract_y_mm: 150.0     # 스쿱 파지 후 첫 WeighHeld에서 BASE +Y로 빼는 거리
      scoop_extract_lift_z_mm: 100.0 # 인출 완료 후 BASE +Z 상승 거리, 이후 원료 계량 자세로 이동
      fingerprint_tolerance_mm: 1.0 # [실물 정밀도 확인 후 확정] WRONG_TOOL 식별 허용차
      cup_width_mm: 60.0            # [구매 후 실측] 약통 파지부 외경 (D-18: 입구 근처를 잡는다, 파지점 위 돌출 ≤ 40 mm)
      force_n: 20.0                 # 데이터시트 조절 범위 3~40 N. modbus 는 2.5 N 스텝 (D-06)
      grip_margin_mm: 2.0           # 분해능 0.1 mm·최대 반복정밀도 0.2 mm보다 크게 잡은 폭 추론 마진
      slip_mm: 1.5                  # 데이터시트 최대 역방향 백래시 0.3 mm보다 크게 잡은 미끄러짐 임계
      state_timeout_s: 0.5          # 이 시간 동안 폭 표본이 없으면 busy=true, grip_inferred=false
      dio_pins: [1, 2]              # dio 백엔드: DO1 grip / DO2 release (grip_test.py)
      din_pins: [0]                 # [팀 확정 필요] 파지 완료 DI (Q-03). 0 = 없음
      completion_settle_s: 0.2     # 실제 busy 해제 후 폭 안정 확인 시간
      dio_settle_s: 0.3             # DO1/DO2 전환 뒤 기구 동작 대기

    # ── 로봇 센서 계량 ───────────────────────────────────────────────
    # ⚠️ [조장·A 확인 필요] 2026-09-21 영점 재작업 완료 — 아래 scale.* 는 아직 **폐기된 9/18·9/19 값**이다 (B 도징).
    #    갱신안(gain 1.03 · offset_g 195.0 · min_resolvable_g 5.0 · max_std_g 8.0)은
    #    gmp_dosing/calibration/README.md 의 "common.yaml 갱신안" 절에, 근거는 gmp_dosing/config/scale_reference.yaml 에.
    #    ⚠️ **적용 전에 계량 자세를 먼저 정해야 한다.** skill_node._do_weigh_held 는 원료마다 material_N.posx 에서
    #       재는데, material_1·2 에서는 max_std_g 가 8 이든 10(아래 현재값)이든 계량이 valid 0/15·2/15 로 거의 전부
    #       무효다 (material_3 은 15/15). 그 자세에서 재는 한 값을 어떻게 두든 도징이 성립하지 않는다.
    scale:
      method: tool_force            # tool_force | workpiece — 9/19 G1 로 tool_force 확정 (D-07). workpiece 는 리셋이 안 먹어 탈락
      period_s: 0.82                # 표본 시작 간격 시험값(9/19 독립 표본 실측). 호출 지연 시 늘어날 수 있음
      samples: 20
      settle_s: 1.0
      gain: 0.8859                  # 9/19 두 점(32 g·132 g) 직선 — 3점째(≈86 g)로 9/21 확인 (gmp_dosing/config/scale_reference.yaml)
      offset_g: 247.091             # tool_force 전용 (같은 직선). 9/18·9/19 단일점 offset 이 2 g 안에서 같아 날짜에 안정
      min_resolvable_g: 19.0        # 회차 평균 3σ — 기존 0.05 s 조건 18.0 g + 여유. 0.82 s 적용 후 실물 재측정 전까지 유지 (3σ 12.6)
      max_std_g: 10.0               # 독립 표본의 회차 내부 σ p95 7.8 g 위 (9/19)
      fz_sign: -1.0                   # G1 확인: 아래 하중이 +Fz 로 읽혀 -1 로 뒤집는다
      simulated: false              # virtual 은 런치가 true 로

    # ── 도징 반복 조건 ───────────────────────────────────────────────
    dosing:
      max_attempts: 3
      scoop_nominal_g: 40.0         # [9/18 실측] 스쿱 1회 퍼올림
      min_fraction: 0.15

    # ── 힘제어·사람 접촉·이동 안전 ──────────────────────────────────
    safety:
      state_poll_s: 0.2             # 워커 안전 상태 조회 간격(장치 호출 시간 별도)
      recovery_timeout_s: 5.0       # 복구 후 기대 상태 확인 대기 한도
      recovery_cache_size: 256      # 기동 세션의 중복 복구 요청 기록 상한, 초과 시 새 요청 거부
      fz_max_n: 1.5                 # check_depth BASE Z축 접촉 판정 기준, 이동 정지 상한은 아님
      compliance_stx: [3000.0, 3000.0, 500.0, 200.0, 200.0, 200.0]   # Z 만 부드럽게
      compliance_settle_s: 0.5     # check_depth 순응 진입 응답 뒤 이동 전 전환 대기
      scoop_force_n: -8.0           # set_desired_force Z (베이스 기준 아래 방향은 음수 — G4 에서 부호 확인)
      dip_max_mm: 40.0              # 담금 깊이 상한 (check_position_condition)
      scoop_timeout_s: 5.0          # [G4 실물 조정] 힘제어 담금 시간 상한
      nudge_enabled: true
      nudge_force_n: 8.0            # 사람 접촉(nudge) 판정 — |F| 가 이 값을 nudge_window_s 이상 넘으면 (D-21)
      nudge_window_s: 0.2
      nudge_cooldown_s: 1.5         # 같은 접촉을 두 번 세지 않게. 두 번째 nudge = 재개

    # ── 붓기 궤적 ────────────────────────────────────────────────────
    pour:
      hold_s: 0.5

    # ── 인터락 복귀 ──────────────────────────────────────────────────
    interlock:
      safe_station: safe
