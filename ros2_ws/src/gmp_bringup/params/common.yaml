# 셀 공통 파라미터 — 실행값의 단일 출처 (docs/interfaces.md 4절)
#
# 구조
#   mode / stations_file : 실행 환경과 위치 파일
#   robot                : 두산 로봇 연결·이동
#   gripper              : RG2 백엔드·폭·파지 판정
#   scale                : 로봇 힘센서 계량
#   dosing               : 공정 반복 조건
#   safety               : 힘제어·넛지·이동 제한
#   pour                 : 붓기와 털어내기
#   interlock            : 정지 시 복귀 위치
#
# cell.launch.py의 mode·vel_scale·simulated·stations_file 인자는 아래 값을 실행 시 덮어쓴다.
/**:
  ros__parameters:
    # ── 실행 환경 ────────────────────────────────────────────────────
    mode: virtual                  # virtual | real
    stations_file: ""             # launch가 stations.yaml의 절대 경로를 넣는다

    # 매 기동 시 작업자가 명시할 때만 사용. 인출·상승 완료 후 material.posx 정지 상태 전용.
    # 투입·반환 중 중단된 상태에는 사용 금지. 공정 기록이나 안전 차단은 복원하지 않는다.
    restore:
      material_id: ""
      operator_id: ""
      confirmed: false
      empty_scoop_confirmed: false # 복원 스쿱이 비어 있음을 이번 기동에 명시할 때만 기준 재계량 허용

    height_measurement:
      # 기준 자세와 스쿱 끝 오프셋은 stations.yaml에서 읽는다.
      reference_station: material_1
      force_trace_only: false      # 진단 시 접촉 정지를 생략하고 힘·자세 CSV 기록
      trace_hz: 10.0
      trace_directory: records/force_traces

    scoop:
      height_measure_only: false  # 수동 진단 전용. Scoop 성공으로 보고하지 않는다

    # ── 두산 로봇 ────────────────────────────────────────────────────
    robot:
      id: dsr01
      model: m0609
      tool_name: tool_weight        # 컨트롤러 등록명 (R7: 1.320 kg, CoG 1.96/-32.76/19.14)
      tcp_name: GripperDA_v1        # 실물 컨트롤러에 등록된 TCP
      virtual_tcp_name: GripperDA_v1 # 가상에서도 실물과 같은 이름으로 아래 오프셋을 등록
      tcp_offset_mm_deg: [0.0, 0.0, 208.0, 0.0, 0.0, 0.0]  # 툴 좌표계 +Z 208 mm
      vel: 60.0                     # DRL 관절 속도 deg/s (movej/movejx)
      acc: 100.0                    # DRL 관절 가속도 deg/s²
      task_vel: [250.0, 80.625]      # DRL 작업공간 [병진 mm/s, 회전 deg/s]
      task_acc: [1000.0, 322.5]      # DRL 작업공간 [병진 mm/s², 회전 deg/s²]
      vel_scale: 1.0                # 9/29 사용자 지정 운영 배율. 런치가 덮어쓴다
      shutdown_timeout_s: 5.0       # 종료 정리 대기 한도. 초과 시 해제 성공으로 처리하지 않음
      motion_timeout_s: 30.0        # 비동기 이동 제한. 초과·취소 시 MoveStop(DR_SSTOP)
      startup_timeout_s: 15.0       # 서비스 준비 및 상태·힘 조회 응답 각각의 제한 시간
      transfer_joint_vel_deg_s: 60.0  # 9/23 DRL set_velj, 실행 시 vel_scale 적용
      transfer_joint_acc_deg_s2: 100.0 # 9/23 DRL set_accj, 실행 시 vel_scale 적용
      pose_xyz_tolerance_mm: 2.0      # 출발 이력·도착 위치 확인 허용오차
      pose_rotation_tolerance_deg: 2.0 # ZYZ 표현 차이가 아닌 실제 회전각 오차
      joint_tolerance_deg: 1.0        # 티칭 관절 구성·수동 이동 여부 확인 허용오차

    # ── RG2 그리퍼 ───────────────────────────────────────────────────
    gripper:
      backend: dio                  # 9/23 DRL 실물 검증: DO 개폐 + DI 완료 (virtual은 런치가 자동)
      open_width_mm: 100.0           # 운용 열림 폭. 데이터시트의 전체 조절 범위는 0~110 mm
      scoop_search_width_mm: 0.0     # 스쿱 파지 탐색 목표 폭 — 기대 폭(WRONG_TOOL 판정)과 분리, 0 = 완전히 닫힐 때까지 접촉 탐색 (A 리뷰, PR #165)
      scoop_expected_widths_mm: [16.5, 17.5, 18.5]  # A/B/C 스쿱 폭 지문 (9/29 확정)
      scoop_extract_y_mm: 150.0     # 스쿱 파지 후 첫 WeighHeld에서 BASE +Y로 빼는 거리
      scoop_extract_lift_z_mm: 100.0 # 인출 완료 후 BASE +Z 상승 거리, 이후 원료 계량 자세로 이동
      fingerprint_tolerance_mm: 0.0 # DIO 폭 미측정·지문 미검증: 기존 비활성 설정 사용
      cup_width_mm: 60.0            # [구매 후 실측] 약통 파지부 외경 (D-18: 입구 근처를 잡는다, 파지점 위 돌출 ≤ 40 mm)
      force_n: 20.0                 # 기존 요청 호환용. DIO에서는 파지력을 설정하지 않는다
      grip_margin_mm: 2.0           # 분해능 0.1 mm·최대 반복정밀도 0.2 mm보다 크게 잡은 폭 추론 마진
      slip_mm: 1.5                  # 데이터시트 최대 역방향 백래시 0.3 mm보다 크게 잡은 미끄러짐 임계
      state_timeout_s: 0.5          # 이 시간 동안 폭 표본이 없으면 busy=true, grip_inferred=false
      dio_pins: [1, 2]              # dio 백엔드: DO1 grip / DO2 release (grip_test.py)
      din_pins: [1, 2]              # 약통 DI1=1, 스쿱 DI1=DI2=1, 열림 DI1=0
      completion_settle_s: 0.2     # 실제 busy 해제 후 폭 안정 확인 시간
      dio_settle_s: 0.8             # 스쿱 DI 완료 확인 후 대기 (DRL); 약통/열림은 DI만 확인

    # ── 로봇 센서 계량 ───────────────────────────────────────────────
    # 보정값은 9/29 측정 PC 실측(#307) — 경로별 container / scoop (아래). 근거·과정은 practice/B/2026-09-29_*.md.
    # ~~「아래 scale.* 는 폐기된 9/18·9/19 값 · 갱신안 gain 1.03·offset 195.0」(9/21)~~ → 9/29 경로별 값으로 대체.
    # ~~「material_1·2 계량은 valid 0/15·2/15 로 거의 전부 무효」(9/22)~~ → 사인 적합 배선(#293) 뒤 9/29 실측
    #   유효 material_1 6/6 · material_2 15/16 · material_3 15/16. 다만 원료통 B(material_2)는 같은 하중 반복
    #   σ 6.5 g 로 A·C(1.2 g)보다 크다 — 계량 자세 문제(#308, A).
    scale:
      method: tool_force            # tool_force | workpiece — 9/19 G1 로 tool_force 확정 (D-07). workpiece 는 리셋이 안 먹어 탈락
      period_s: 0.82                # 표본 시작 간격 시험값(9/19 독립 표본 실측). 호출 지연 시 늘어날 수 있음
      samples: 20
      settle_s: 10.0
      # ── 보정 직선은 경로별 (9/29 #307) ─────────────────────────────
      # 용기와 스쿱의 gain 이 9/29 실측으로 11 % 갈렸다 — 하나로 두면 어느 쪽이든 순량이 10 % 넘게 틀린다.
      # skill_node(execution/weighing.py)가 계량 subject 로 골라 읽는다. 공통 gain/offset_g/max_std_g 는 없다 —
      # 옛 키를 남기면 누가 읽어도 조용히 틀린 값이 된다.
      # ~~gain 0.8859 · offset_g 247.091~~ (9/19 우드락 공구) → 이 값이면 용기 순량 237 g 이 193 g(−19 %)으로 읽혔다.
      # ⚠️ 전제: 공구 등록 tool_weight 1.36 kg 동결(실물은 PLA 부착물 ≈ 60 g 제거로 ≈ 1.30 kg).
      #    공구를 재등록하면 offset_g 를 다시 잰다(gain 은 그대로).
      container:                    # TARE·VERIFY — workbench AT 파지 → ABOVE(z 180) 계량
        gain: 1.0975                #   79·154·229·316 g 한 파지 8회, ±0.6 %, 최대 잔차 1.95 g
        offset_g: 229.0             #   gmp_dosing/calibration/g1_0929_gain3pt.csv
        max_std_g: 10.0             #   정확도 게이트(적합 잔차 σ). 종전 공통값 유지
      scoop:                        # SCOOP_TARE·WEIGH_SCOOP — 원료 계량 자세(material_N.posx)
        gain: 0.983                 #   원료통 A·C 합산 21회 ±1.0 %(세 스테이션 0.976 ±2.0 %) — 스테이션별 gain 불필요
        offset_g: 103.5             #   material_1 값. **절대값은 스테이션마다 다르다**(material_2 5.6 · material_3 243.5) —
                                    #   순량은 같은 스테이션의 차이값이라 상쇄되어 판정엔 무관. 스쿱 총무게 표시는 참고용
        max_std_g: 10.0             #   g1_0929_scoop_gain3pt.csv · g1_0929_scoop_gain_m2.csv · g1_0929_scoop_gain_m3.csv
      max_hf_std_g: 9.5             # 인접 표본 차이 무결성 게이트. 0이면 끄기 (#208)
      zero_drift_limit_n: 0.1       # 빈 그리퍼 영점 이동 한계 [N]. 0 이면 검사 꺼짐.
                                    # **같은 자세 반복 산포 기준** — TARE 직전과 VERIFY 직전 모두 workbench
                                    # ABOVE 에서 재므로 자세 차이는 들어가지 않는다. 0.1 N ≈ 10 g 은 σ_cup
                                    # 0.91 g 의 11배, ① 허용 22.5 g 의 절반 아래 — 27 g(0.26 N) 계단을 잡는다.
                                    # B 의 tool_state_check 로 같은 자세 반복 fz 산포를 받아 확정
      fz_sign: -1.0                   # G1 확인: 아래 하중이 +Fz 로 읽혀 -1 로 뒤집는다
      simulated: false              # virtual 은 런치가 true 로

    # ── 도징 반복 조건 ───────────────────────────────────────────────
    dosing:
      max_attempts: 8               # **붓기 시도** 상한 (한 원료). 3 이면 한 원료 상한이 3×40 = 120 g 이라
                                    # 데모 A(200 g)·B(150 g)가 TIMEOUT 으로 완료 불가였다 (#189).
                                    # 하한은 ceil(최대 목표량 ÷ 그 원료 1회량) — 9/29 값(A·C 69 · B 57)과 두 스쿱 목표면 2.
                                    # (9/25 D-35 의 158÷79, 9/23 D-33 의 170÷85 도 2). 여기에 퍼올림 부족·마지막 부분 스쿱 여유를
                                    # 더해 **8 을 유지한다** — 하한이 내려갔다고 상한을 줄일 이유는 없다.
                                    # 더 큰 레시피를 쓰려면 같이 올려야 한다.
      max_returns: 3                # **초과 반환** 상한 (한 원료). 위와 성격이 다르다 — 깊이 보정이
                                    # 수렴하는지를 보는 오류 복구 한계라 레시피 크기와 무관하다.
                                    # 9/22 이전에는 max_attempts 하나로 둘을 겸해서, 붓기 상한을 올리면
                                    # 반환 허용도 같이 올라가는 문제가 있었다 (#189).
      scoop_nominal_g: 69.0         # [9/29] 원료별 값(아래 scoop_nominal)이 없을 때의 공통값 = A·C 값.
                                    # ~~79.0 (9/25 D-35, 9/23 A 78.9 g)~~ → 그 측정은 마찰테이프 없이 잰 값이라 무효(9/29).
                                    # 종전 85.0(D-33) · 40.0(9/18)
      scoop_nominal:                # [9/29 조장 결정] 원료별 스쿱 1회 투입량 [g] — A·C 묶음 / B 별도.
        A: 69.0                     #   실측(현 구성: 마찰테이프·손잡이 16.5/17.5/18.5 mm, vel_scale 1.0)
        B: 57.0                     #   A 69.3 · B 57.4 · C 67.4 g → 반올림(사용자 결정). 원료통 B 만 경사·높이가 다르다
        C: 69.0                     #   근거 gmp_dosing/calibration/scoop_sigma_0929_mat{A,B,C}.csv
                                    #   process_node 가 이 값을 DosingConfig.scoop_nominal_by_material 로 넘긴다(C).
                                    #   원료가 빠지면 for_material() 이 KeyError — 공통값으로 조용히 떨어지지 않는다
      min_fraction: 0.10            # [9/23 조장 결정] 담그기 깊이 비율 하한. 종전 0.15
                                    # ⚠️ **교착 조건**: min_fraction × scoop_nominal_g ≤ 2 × target × tol
                                    #    이어야 한다. 넘으면 UNDER 뒤 최소 채취가 허용 상한을 넘겨
                                    #    스쿱↔반환이 반복된다. 9/29 값이면 A·C 6.9 g · B 5.7 g 이고
                                    #    한계는 목표 57 g·±10 % 에서 11.4 g 이라 2 배 여유다.
                                    #    ⛔ 종전 조합(0.15×40 = 6.0)은 40 g·±5 % 한계 4.0 g 을 넘겨
                                    #       **이미 교착이었다** (recipe-01 세 원료 전부).
                                    #    test_dosing.py 가 파라미터 파일을 읽어 이 조건을 단언한다 —
                                    #    값을 바꾸면 시험이 먼저 깨진다.
      fixed_scoop: true             # [9/23 D-33] 시연은 끝까지 담그는 고정 스쿱. process 는 모든 Scoop 에 depth_fraction=1.0 을 보낸다.
      empty_scoop_g: 2.0            # [#282] 순중량이 이 이하면 빈 스쿱. 고정 경로는 접촉을 안 재므로
                                    # **무게가 유일한 증거**다 — 이 값이 없으면 가득 찬 통에도 보충을 요구한다.
                                    # ⚠️ **잠정값** — 정작 필요한 「빈 스쿱 계량 산포」는 아직 미측정이다.
                                    # #272 는 *퍼낸 양*의 산포(평균 78.9 · σ 3.9)를 쟀지 계량 잡음이 아니다.

    # ── 힘제어·사람 접촉·이동 안전 ──────────────────────────────────
    safety:
      collision_sensitivity: 50.0  # 9/22 사용자 확정. 전역 감도 %, 실물 자가진단에서 일치 확인(자동 변경 없음)
      state_poll_s: 0.2             # 워커 안전 상태 조회 간격(장치 호출 시간 별도)
      recovery_timeout_s: 5.0       # 복구 후 기대 상태 확인 대기 한도
      recovery_cache_size: 256      # 기동 세션의 중복 복구 요청 기록 상한, 초과 시 새 요청 거부
      fz_max_n: 1.5                 # BASE |Fz-빈 스쿱 Fz| 접촉 판정 → 감속 정지 요청. 실제 힘 상한 보장은 아님
      compliance_stx: [3000.0, 3000.0, 500.0, 200.0, 200.0, 200.0]   # Z 만 부드럽게
      compliance_settle_s: 0.5     # check_depth 순응 진입 응답 뒤 이동 전 전환 대기
      scoop_force_n: -8.0           # set_desired_force Z (베이스 기준 아래 방향은 음수 — G4 에서 부호 확인)
      dip_max_mm: 40.0              # 담금 깊이 상한 (check_position_condition)
      scoop_timeout_s: 5.0          # [G4 실물 조정] 힘제어 담금 시간 상한
      nudge_enabled: true
      nudge_force_n: 8.0            # 사람 접촉(nudge) 판정 — |F| 가 이 값을 nudge_window_s 이상 넘으면 (D-21)
      nudge_window_s: 0.2
      nudge_cooldown_s: 1.5         # 같은 접촉을 두 번 세지 않게. 두 번째 nudge = 재개

    # ── 붓기 궤적 ────────────────────────────────────────────────────
    pour:
      hold_s: 0.5

    # ── 인터락 복귀 ──────────────────────────────────────────────────
    interlock:
      safe_station: safe
