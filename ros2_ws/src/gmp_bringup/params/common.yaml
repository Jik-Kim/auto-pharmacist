# 공통 파라미터 — 값의 단일 출처 (docs/interfaces.md 4절). 코드에 상수를 두지 않는다.
# 런치 인자(mode·vel_scale·simulated·stations_file)만 이 위에 덮어쓴다.
/**:
  ros__parameters:
    robot:
      id: dsr01
      model: m0609
      tool_name: tool_weight        # 컨트롤러 등록명 (R7: 1.320 kg, CoG 1.96/-32.76/19.14)
      tcp_name: GripperDA_v1
      vel: 60.0                     # set_velx 병진 mm/s · 회전 deg/s 상한
      acc: 60.0
      vel_scale: 0.3                # 런치가 덮어쓴다. 실물 첫 기동 0.2
      motion_timeout_s: 30.0        # 비동기 이동 제한. 초과·취소 시 MoveStop(DR_SSTOP)
    gripper:
      backend: modbus               # modbus | dio  (virtual 은 런치가 자동)
      open_width_mm: 100.0
      scoop_width_mm: 18.0          # 레거시 파지 명령값. C의 원료별 명령 전환 전까지 유지
      scoop_expected_widths_mm: [15.5, 28.0, 38.5]  # A/B/C 폭 지문. A 실측 범위 약 15~16 mm
      fingerprint_tolerance_mm: 1.0 # [실물 정밀도 확인 후 확정] WRONG_TOOL 식별 허용차
      cup_width_mm: 60.0            # [구매 후 실측] 약통 파지부 외경 (D-18: 입구 근처를 잡는다, 파지점 위 돌출 ≤ 40 mm)
      force_n: 20.0                 # 3~40. modbus 는 2.5 N 스텝 (D-06)
      grip_margin_mm: 2.0           # 폭 추론 마진 (계약 2절)
      slip_mm: 1.5
      state_timeout_s: 0.5          # 이 시간 동안 폭 표본이 없으면 busy=true, grip_inferred=false
      dio_pins: [1, 2]              # dio 백엔드: DO1 grip / DO2 release (grip_test.py)
      din_pins: [0]                 # [팀 확정 필요] 파지 완료 DI (Q-03). 0 = 없음
      dio_settle_s: 0.3             # DO1/DO2 전환 뒤 기구 동작 대기
    scale:
      method: workpiece             # workpiece | tool_force  (D-07)
      samples: 20
      settle_s: 1.0
      gain: 1.0                     # 9/21 실제 저울 5점 비교로 확정 (G1 은 133 g 단일 무게라 기울기 미확정)
      offset_g: 0.0                 # method 에 종속 — tool_force 로 바꾸면 260.164 (gmp_dosing/config/scale_reference.yaml). workpiece 는 미측정
      min_resolvable_g: 19.0        # G1 9/18 실측 — 회차 평균 3σ 18.0 g + 여유 (근거: gmp_dosing/calibration, core/calib.py)
      max_std_g: 5.0                # G1 회차 내부 σ p95 4.1 g 위
      fz_sign: -1.0                   # G1 확인: 아래 하중이 +Fz 로 읽혀 -1 로 뒤집는다
      simulated: false              # virtual 은 런치가 true 로
    dosing:
      max_attempts: 3
      scoop_nominal_g: 40.0         # [9/18 실측] 스쿱 1회 퍼올림
      min_fraction: 0.15
    safety:
      fz_max_n: 15.0                # Scoop 담그기 접촉 판정·상한 (check_force_condition)
      compliance_stx: [3000.0, 3000.0, 500.0, 200.0, 200.0, 200.0]   # Z 만 부드럽게
      scoop_force_n: -8.0           # set_desired_force Z (베이스 기준 아래 방향은 음수 — G4 에서 부호 확인)
      dip_max_mm: 40.0              # 담금 깊이 상한 (check_position_condition)
      scoop_timeout_s: 5.0          # [G4 실물 조정] 힘제어 담금 시간 상한
      nudge_enabled: true
      nudge_force_n: 8.0            # 사람 접촉(nudge) 판정 — |F| 가 이 값을 nudge_window_s 이상 넘으면 (D-21)
      nudge_window_s: 0.2
      nudge_cooldown_s: 1.5         # 같은 접촉을 두 번 세지 않게. 두 번째 nudge = 재개
    pour:
      tilt_deg: 110.0               # [실물 티칭 후 확정] 스쿱 기울임 각
      tilt_axis: 4                  # posx 회전축 인덱스(3~5). [실물 티칭 후 확정]
      hold_s: 0.5
      shake_amp_deg: 4.0            # 부분 붓기 털어내기 진폭
      shake_period_s: 0.5
      shake_atime_s: 0.2
      shake_repeat: 2
    interlock:
      safe_station: safe
